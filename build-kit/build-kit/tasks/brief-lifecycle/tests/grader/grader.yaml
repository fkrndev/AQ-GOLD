  - id: lint
    category: regular
    description: The workspace passes its own lint and type checks.
    method: command
    blocker: true
    weight: 1
    command: "rm -rf tests/hidden && npm run lint && ./node_modules/.bin/tsc --noEmit"
    timeout_seconds: 180
  - id: protected_surfaces
    category: regular
    description: The change leaves the protected surfaces alone and stays within a generous size cap.
    method: scope
    blocker: true
    weight: 1
    scope:
      allowed_paths:
        - "*"
      denied_paths:
        - "package.json"
        - "package-lock.json"
        - "next.config.ts"
        - "tsconfig.json"
        - "vitest.config.ts"
        - "tailwind.config.ts"
        - "postcss.config.mjs"
        - "eslint.config.mjs"
        - "sanity.config.ts"
        - "sanity.cli.ts"
        - "app/studio/**"
        - "app/(site)/brief/catalog.ts"
        - "scripts/**"
        - "public/**"
      max_files: 40
      max_changed_lines: 8000
  - id: focused_change
    category: patch_specific
    description: The change stays within the brief engine and its tests, bounded in size.
    method: scope
    blocker: false
    weight: 0.1
    scope:
      allowed_paths:
        - "app/(site)/brief/**"
        - "tests/**"
      denied_paths: []
      max_files: 12
      max_changed_lines: 2500
calibrations:
  - id: alternative-valid
    type: alternative_valid
    patch: solution/alternative.patch
    criteria_results:
      - criterion_id: f2p
        passed: true
        score: 1
      - criterion_id: p2p
        passed: true
        score: 1
  - id: plausible-negative
    type: negative
    patch: solution/negative.patch
    criteria_results:
      - criterion_id: f2p
        passed: false
        score: 0
